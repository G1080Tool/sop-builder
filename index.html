<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global 1080 · Process & SOP Architect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- PWA / installable app -->
<meta name="description" content="Document, map, and approve your team's standard operating procedures — Global 1080.">
<meta name="theme-color" content="#0C0634">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SOP Architect">
<style>
:root{
  --navy:#0C0634;--navy-1:#130c40;--navy-2:#191152;--navy-3:#221863;
  --line:rgba(244,244,244,.10);--line-2:rgba(244,244,244,.16);
  --coral:#FF4948;--coral-2:#ff6b6a;--coral-soft:rgba(255,73,72,.14);--coral-line:rgba(255,73,72,.45);
  --cream:#F4F4F4;--cream-dim:rgba(244,244,244,.62);--cream-faint:rgba(244,244,244,.40);
  --paper:#FAFAFA;--ink:#161229;--ok:#37d399;--warn:#ffb454;
  --serif:'Playfair Display',Georgia,'Times New Roman',serif;
  --sans:'Hanken Grotesk',ui-sans-serif,system-ui,-apple-system,sans-serif;--r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);color:var(--cream);background:var(--navy);
  background-image:radial-gradient(1100px 700px at 82% -8%, rgba(255,73,72,.10), transparent 60%),radial-gradient(900px 600px at -5% 110%, rgba(34,24,99,.55), transparent 55%);
  background-attachment:fixed;-webkit-font-smoothing:antialiased;line-height:1.5}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:rgba(244,244,244,.16);border-radius:20px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(244,244,244,.28);background-clip:content-box}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:18px;padding:14px 26px;background:rgba(12,6,52,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;flex-shrink:0}
.brand .mark{width:30px;height:48px;flex-shrink:0}
.brand .divider{width:1px;height:42px;background:var(--cream);opacity:.55}
.brand .word{font-family:var(--serif);line-height:1.02}
.brand .word .l1{font-size:18px;font-weight:700;letter-spacing:.2px}
.brand .word .l2{font-size:12.5px;font-weight:500;color:var(--cream-dim);letter-spacing:.3px}
.tagline{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--coral);font-weight:600}
nav.tabs{display:flex;gap:4px;margin-left:auto;background:rgba(244,244,244,.05);padding:5px;border-radius:12px;border:1px solid var(--line)}
nav.tabs button{border:none;background:transparent;color:var(--cream-dim);padding:8px 14px;border-radius:8px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:7px;transition:.18s}
nav.tabs button svg{width:15px;height:15px}
nav.tabs button:hover{color:var(--cream)}
nav.tabs button.active{background:var(--coral);color:#fff;box-shadow:0 6px 18px -8px var(--coral)}
.langsel{display:flex;background:rgba(244,244,244,.05);border:1px solid var(--line);border-radius:10px;padding:3px;flex-shrink:0}
.langsel button{border:none;background:transparent;color:var(--cream-dim);padding:6px 11px;border-radius:7px;font-size:12px;font-weight:700;letter-spacing:.04em;transition:.15s}
.langsel button:hover{color:var(--cream)}
.langsel button.active{background:var(--coral);color:#fff}
.bar-actions{display:flex;gap:8px;flex-shrink:0}
.btn{border:1px solid var(--line-2);background:rgba(244,244,244,.04);color:var(--cream);padding:8px 14px;border-radius:9px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:.16s;white-space:nowrap}
.btn svg{width:15px;height:15px}
.btn:hover{background:rgba(244,244,244,.10)}
.btn.primary{background:var(--coral);border-color:var(--coral);color:#fff}
.btn.primary:hover{background:var(--coral-2);box-shadow:0 8px 22px -10px var(--coral)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--cream-dim)}
.btn.ghost:hover{color:var(--cream);background:rgba(244,244,244,.06)}
.btn.sm{padding:6px 11px;font-size:12px}
.btn.danger{border-color:rgba(255,73,72,.4);color:var(--coral-2)}
.btn.danger:hover{background:var(--coral-soft)}
.wrap{max-width:1340px;margin:0 auto;padding:30px 30px 80px}
.view{display:none;animation:fade .4s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:26px;flex-wrap:wrap}
.page-head h1{font-family:var(--serif);font-size:30px;font-weight:700;letter-spacing:.2px}
.page-head p{color:var(--cream-dim);font-size:14px;margin-top:5px;max-width:580px}
.card{background:linear-gradient(180deg,var(--navy-1),var(--navy));border:1px solid var(--line);border-radius:var(--r)}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--coral);font-weight:700}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat{padding:20px;position:relative;overflow:hidden}
.stat .k{font-family:var(--serif);font-size:42px;font-weight:700;line-height:1}
.stat .lbl{font-size:12.5px;color:var(--cream-dim);margin-top:8px;font-weight:500}
.stat .ic{position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--coral-soft)}
.stat .ic svg{width:18px;height:18px;color:var(--coral)}
.dash-2{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}
.panel{padding:22px}
.panel h3{font-family:var(--serif);font-size:19px;font-weight:600;margin-bottom:3px}
.panel .sub{font-size:12.5px;color:var(--cream-dim);margin-bottom:18px}
.readiness{display:flex;align-items:center;gap:24px;margin-bottom:8px}
.ring{--p:0;width:120px;height:120px;border-radius:50%;flex-shrink:0;background:conic-gradient(var(--coral) calc(var(--p)*1%), rgba(244,244,244,.10) 0);display:grid;place-items:center;position:relative}
.ring::before{content:"";position:absolute;inset:11px;border-radius:50%;background:var(--navy)}
.ring .v{position:relative;font-family:var(--serif);font-size:30px;font-weight:700}
.ring .v small{font-size:14px;font-weight:600;color:var(--cream-dim)}
.readiness .meta{flex:1}
.readiness .meta .t{font-size:14px;font-weight:600;margin-bottom:10px}
.bar{margin-bottom:13px}
.bar .row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;gap:10px}
.bar .row .dept-name{display:flex;align-items:center;gap:8px;font-weight:600}
.bar .row .cnt{color:var(--cream-dim);text-align:right}
.bar .track{height:8px;background:rgba(244,244,244,.08);border-radius:20px;overflow:hidden}
.bar .fill{height:100%;border-radius:20px;transition:width .6s cubic-bezier(.2,.7,.2,1)}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.checks{display:flex;flex-direction:column;gap:10px}
.check{display:flex;gap:12px;align-items:flex-start;padding:13px 15px;border-radius:11px;background:rgba(244,244,244,.04);border:1px solid var(--line)}
.check .ci{width:30px;height:30px;border-radius:8px;flex-shrink:0;display:grid;place-items:center}
.check .ci svg{width:16px;height:16px}
.check.good .ci{background:rgba(55,211,153,.14);color:var(--ok)}
.check.warn .ci{background:rgba(255,180,84,.14);color:var(--warn)}
.check.bad .ci{background:var(--coral-soft);color:var(--coral)}
.check .ctext{flex:1}
.check .ctext .h{font-size:13.5px;font-weight:600}
.check .ctext .d{font-size:12px;color:var(--cream-dim);margin-top:2px}
.check .num{font-family:var(--serif);font-size:20px;font-weight:700;align-self:center}
.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.search{flex:1;min-width:200px;position:relative}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--cream-faint)}
.search input{width:100%;padding:11px 14px 11px 38px;background:rgba(244,244,244,.05);border:1px solid var(--line);border-radius:10px;color:var(--cream);font-size:14px}
.search input:focus{outline:none;border-color:var(--coral-line);background:rgba(244,244,244,.07)}
.sel{padding:10px 14px;background:rgba(244,244,244,.05);border:1px solid var(--line);border-radius:10px;color:var(--cream);font-size:13.5px;font-weight:500}
.sel:focus{outline:none;border-color:var(--coral-line)}
.proc-table{width:100%;border-collapse:collapse;font-size:13.5px}
.proc-table thead th{text-align:left;padding:13px 16px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--cream-faint);font-weight:700;border-bottom:1px solid var(--line-2)}
.proc-table tbody tr{border-bottom:1px solid var(--line);transition:.14s}
.proc-table tbody tr:hover{background:rgba(244,244,244,.04)}
.proc-table td{padding:14px 16px;vertical-align:middle}
.proc-table .pname{font-weight:700;font-size:14.5px;cursor:pointer}
.proc-table .pname:hover{color:var(--coral-2)}
.proc-table .pmeta{font-size:12px;color:var(--cream-faint);margin-top:2px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.tag.dept{background:rgba(244,244,244,.06);border:1px solid var(--line)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 11px;border-radius:20px}
.status::before{content:"";width:7px;height:7px;border-radius:50%}
.status.draft{background:rgba(244,244,244,.07);color:var(--cream-dim)}
.status.draft::before{background:var(--cream-faint)}
.status.review{background:rgba(255,180,84,.13);color:var(--warn)}
.status.review::before{background:var(--warn)}
.status.approved{background:rgba(55,211,153,.13);color:var(--ok)}
.status.approved::before{background:var(--ok)}
.status.submitted{background:rgba(91,141,239,.15);color:#8fb2f5}
.status.submitted::before{background:#5B8DEF}
.status.dir_approved{background:rgba(199,125,255,.15);color:#d4a6ff}
.status.dir_approved::before{background:#C77DFF}
.owner-cell{display:flex;align-items:center;gap:10px}
.avatar{width:30px;height:30px;border-radius:8px;background:var(--coral-soft);color:var(--coral-2);display:grid;place-items:center;font-size:12px;font-weight:700;flex-shrink:0}
.avatar.none{background:rgba(244,244,244,.06);color:var(--cream-faint)}
.row-act{display:flex;gap:4px;justify-content:flex-end}
.icon-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:transparent;display:grid;place-items:center;transition:.14s}
.icon-btn svg{width:15px;height:15px;color:var(--cream-dim)}
.icon-btn:hover{background:rgba(244,244,244,.07)}
.icon-btn:hover svg{color:var(--cream)}
.icon-btn.del:hover{border-color:var(--coral-line)}
.icon-btn.del:hover svg{color:var(--coral)}
.empty{text-align:center;padding:60px 20px;color:var(--cream-dim)}
.empty svg{width:42px;height:42px;color:var(--cream-faint);margin-bottom:14px}
.map-legend{display:flex;gap:20px;align-items:center;margin-bottom:16px;flex-wrap:wrap;font-size:12.5px;color:var(--cream-dim)}
.map-legend .li{display:flex;align-items:center;gap:8px}
.legend-line{width:26px;height:2px;border-radius:2px}
.map-scroll{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(180deg,rgba(19,12,64,.5),rgba(12,6,52,.5)),radial-gradient(circle at 1px 1px, rgba(244,244,244,.05) 1px, transparent 0);background-size:auto,26px 26px;position:relative}
.lanes{display:flex;gap:0;padding:18px;min-width:min-content;position:relative;z-index:2}
.lane{flex:0 0 250px;padding:0 12px;border-right:1px dashed var(--line)}
.lane:last-child{border-right:none}
.lane-head{display:flex;align-items:center;gap:9px;padding:8px 4px 14px;font-size:13px;font-weight:700;position:sticky;top:0}
.lane-head .lcount{margin-left:auto;font-size:11px;color:var(--cream-faint);font-weight:600}
.node{background:linear-gradient(180deg,var(--navy-2),var(--navy-1));border:1px solid var(--line-2);border-radius:11px;padding:13px 14px;margin-bottom:16px;cursor:pointer;transition:.16s;position:relative}
.node:hover{border-color:var(--coral-line);transform:translateY(-2px);box-shadow:0 12px 28px -16px rgba(0,0,0,.8)}
.node.dim{opacity:.28}
.node.hl{border-color:var(--coral);box-shadow:0 0 0 1px var(--coral),0 14px 30px -14px var(--coral)}
.node .nname{font-size:13.5px;font-weight:700;line-height:1.25;margin-bottom:7px}
.node .nfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px}
.node .nowner{font-size:11px;color:var(--cream-dim);display:flex;align-items:center;gap:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .ndot{position:absolute;top:14px;right:13px;width:8px;height:8px;border-radius:50%}
svg.links{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;overflow:visible}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.lib-card{padding:18px;cursor:pointer;transition:.16s;display:flex;flex-direction:column;gap:12px;min-height:150px}
.lib-card:hover{border-color:var(--coral-line);transform:translateY(-3px)}
.lib-card .lc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.lib-card .lc-name{font-family:var(--serif);font-size:17px;font-weight:600;line-height:1.2}
.lib-card .lc-purpose{font-size:12.5px;color:var(--cream-dim);flex:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.lib-card .lc-foot{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--cream-faint);border-top:1px solid var(--line);padding-top:11px}
.overlay{position:fixed;inset:0;background:rgba(5,2,24,.72);backdrop-filter:blur(4px);z-index:90;opacity:0;pointer-events:none;transition:.25s}
.overlay.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(640px,100%);background:var(--navy);border-left:1px solid var(--line-2);z-index:100;transform:translateX(100%);transition:transform .32s cubic-bezier(.3,.7,.2,1);display:flex;flex-direction:column;box-shadow:-30px 0 60px -30px rgba(0,0,0,.8)}
.drawer.show{transform:none}
.drawer-head{padding:20px 26px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:14px;flex-shrink:0}
.drawer-head .dh-eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--coral);font-weight:700}
.drawer-head h2{font-family:var(--serif);font-size:22px;font-weight:600;margin-top:3px}
.drawer-body{padding:24px 26px;overflow-y:auto;flex:1}
.drawer-foot{padding:16px 26px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-shrink:0;background:var(--navy-1)}
.fgroup{margin-bottom:20px}
.fgroup>label{display:block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--cream-dim);margin-bottom:8px}
.fgroup .hint{font-size:11.5px;color:var(--cream-faint);font-weight:400;text-transform:none;letter-spacing:0;margin-top:-4px;margin-bottom:8px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
input.fi,select.fi,textarea.fi{width:100%;padding:11px 13px;background:rgba(244,244,244,.05);border:1px solid var(--line);border-radius:9px;color:var(--cream);font-size:14px;transition:.15s}
input.fi:focus,select.fi:focus,textarea.fi:focus{outline:none;border-color:var(--coral-line);background:rgba(244,244,244,.07)}
textarea.fi{resize:vertical;min-height:62px;line-height:1.5}
.section-divider{display:flex;align-items:center;gap:12px;margin:28px 0 18px}
.section-divider .sd-line{flex:1;height:1px;background:var(--line)}
.section-divider .sd-t{font-family:var(--serif);font-size:15px;font-weight:600;color:var(--cream)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:9px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 6px 5px 12px;background:var(--coral-soft);border:1px solid var(--coral-line);border-radius:20px;font-size:12.5px;font-weight:600;color:var(--cream)}
.chip button{background:none;border:none;color:var(--coral-2);display:grid;place-items:center;width:18px;height:18px;border-radius:50%}
.chip button:hover{background:rgba(255,73,72,.2)}
.chip button svg{width:12px;height:12px}
.chip-input{display:flex;gap:8px}
.chip-input input{flex:1}
.step{display:flex;gap:10px;margin-bottom:10px;align-items:flex-start;background:rgba(244,244,244,.03);border:1px solid var(--line);border-radius:10px;padding:11px}
.step .snum{width:24px;height:24px;border-radius:7px;background:var(--coral);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;flex-shrink:0;margin-top:3px}
.step .sfields{flex:1;display:flex;flex-direction:column;gap:8px}
.step .srow2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.step .sctrl{display:flex;flex-direction:column;gap:4px}
.step .sctrl button{width:24px;height:22px;border-radius:6px;border:1px solid var(--line);background:transparent;display:grid;place-items:center;color:var(--cream-dim)}
.step .sctrl button:hover{background:rgba(244,244,244,.07);color:var(--cream)}
.step .sctrl button svg{width:13px;height:13px}
.mini-i{padding:8px 11px;font-size:13px;background:rgba(244,244,244,.05);border:1px solid var(--line);border-radius:8px;color:var(--cream);width:100%}
.mini-i:focus{outline:none;border-color:var(--coral-line)}
.dep-list{max-height:200px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:6px}
.dep-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;transition:.12s}
.dep-item:hover{background:rgba(244,244,244,.05)}
.dep-item input{width:16px;height:16px;accent-color:var(--coral)}
.dep-item .di-name{font-size:13px;font-weight:600}
.dep-item .di-dept{font-size:11px;color:var(--cream-faint)}
.doc-overlay{position:fixed;inset:0;background:rgba(5,2,24,.8);backdrop-filter:blur(4px);z-index:110;display:none;overflow-y:auto;padding:30px 20px}
.doc-overlay.show{display:block}
.doc-toolbar{max-width:820px;margin:0 auto 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
#sopDoc{max-width:820px;margin:0 auto;background:var(--paper);color:var(--ink);border-radius:6px;padding:0;box-shadow:0 30px 80px -30px rgba(0,0,0,.7)}
.doc-header{background:var(--navy);color:var(--cream);padding:34px 44px;border-radius:6px 6px 0 0;display:flex;align-items:center;gap:18px}
.doc-header .divider{width:1px;height:46px;background:var(--cream);opacity:.5}
.doc-header .dw .l1{font-family:var(--serif);font-size:20px;font-weight:700}
.doc-header .dw .l2{font-size:12px;color:var(--cream-dim)}
.doc-header .doctype{margin-left:auto;text-align:right}
.doc-header .doctype .dt{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--coral-2);font-weight:700}
.doc-header .doctype .dn{font-family:var(--serif);font-size:15px}
.doc-body{padding:38px 44px 48px}
.doc-title{font-family:var(--serif);font-size:30px;font-weight:700;line-height:1.1;color:var(--ink)}
.doc-meta-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#e3e3e8;border:1px solid #e3e3e8;border-radius:8px;overflow:hidden;margin:24px 0 30px}
.doc-meta-grid .mc{background:var(--paper);padding:13px 15px}
.doc-meta-grid .mc .ml{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#8a8a96;font-weight:700}
.doc-meta-grid .mc .mv{font-size:14px;font-weight:600;margin-top:4px;color:var(--ink)}
.doc-section{margin-bottom:26px}
.doc-section h4{font-family:var(--serif);font-size:17px;font-weight:700;color:var(--ink);padding-bottom:7px;border-bottom:2px solid var(--coral);display:inline-block;margin-bottom:13px}
.doc-section p{font-size:14px;color:#3a3744;line-height:1.6}
.doc-2col{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.doc-list{list-style:none}
.doc-list li{font-size:13.5px;color:#3a3744;padding:6px 0 6px 22px;position:relative;border-bottom:1px solid #eee}
.doc-list li::before{content:"";position:absolute;left:3px;top:13px;width:7px;height:7px;border-radius:50%;background:var(--coral)}
.doc-steps{counter-reset:s}
.doc-step{display:flex;gap:16px;padding:14px 0;border-bottom:1px solid #eee}
.doc-step .dsn{counter-increment:s;flex-shrink:0;width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center}
.doc-step .dsn::before{content:counter(s)}
.doc-step .dsc{flex:1}
.doc-step .dst{font-size:14px;color:var(--ink);font-weight:500;line-height:1.5}
.doc-step .dsm{font-size:11.5px;color:#8a8a96;margin-top:5px;display:flex;gap:16px;flex-wrap:wrap}
.doc-step .dsm b{color:#5a5766;font-weight:700}
.flow-rel{display:flex;flex-direction:column;gap:8px}
.flow-rel .fr{display:flex;align-items:center;gap:10px;font-size:13px;padding:9px 12px;background:#f4f4f6;border-radius:8px}
.flow-rel .fr svg{width:16px;height:16px;flex-shrink:0;color:var(--coral)}
.flow-rel .fr b{color:var(--ink)}
.flow-rel .fr .fd{color:#8a8a96;font-size:11.5px;margin-left:auto}
.doc-footer{padding:18px 44px;border-top:1px solid #eee;display:flex;justify-content:space-between;font-size:11px;color:#9a9aa4;gap:12px;flex-wrap:wrap}
.doc-empty-note{font-size:13px;color:#9a9aa4;font-style:italic}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy-3);border:1px solid var(--coral-line);color:var(--cream);padding:12px 20px;border-radius:11px;font-size:13.5px;font-weight:600;z-index:200;opacity:0;transition:.3s;box-shadow:0 16px 40px -16px rgba(0,0,0,.8);display:flex;align-items:center;gap:10px}
.toast svg{width:17px;height:17px;color:var(--coral)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:900px){.stat-grid{grid-template-columns:repeat(2,1fr)}.dash-2{grid-template-columns:1fr}.f2,.doc-2col,.doc-meta-grid{grid-template-columns:1fr}.doc-meta-grid{grid-template-columns:1fr 1fr}.tagline{display:none}nav.tabs button span{display:none}}
@media print{
  body *{visibility:hidden}
  .doc-overlay,.doc-overlay *{visibility:visible}
  .doc-overlay{position:absolute;inset:0;background:#fff;padding:0;display:block}
  .doc-toolbar{display:none}
  #sopDoc{box-shadow:none;max-width:100%;border-radius:0}
  .doc-header{border-radius:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .doc-step .dsn,.doc-list li::before,.doc-section h4,.doc-meta-grid,.sop-page{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sop-page{break-before:page;page-break-before:always}
  .doc-step,.doc-meta-grid,.flow-rel .fr,.doc-list li{break-inside:avoid;page-break-inside:avoid}
  .doc-section h4{break-after:avoid;page-break-after:avoid}
}
.sop-page{border-top:8px solid var(--coral)}
/* external supplier nodes + lane */
.lane.ext{flex:0 0 232px;background:rgba(255,180,84,.04)}
.lane.ext .lane-head{color:var(--warn)}
.node.ext{background:linear-gradient(180deg,rgba(255,180,84,.10),rgba(19,12,64,.6));border:1.5px dashed rgba(255,180,84,.55)}
.node.ext:hover{border-color:var(--warn);box-shadow:0 12px 28px -16px rgba(0,0,0,.8)}
.node.ext.hl{border-style:solid;border-color:var(--warn);box-shadow:0 0 0 1px var(--warn),0 14px 30px -14px var(--warn)}
.node.ext .ndot{background:var(--warn)!important}
.node .ntype{font-size:10.5px;color:var(--cream-faint);text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin-top:6px}
.ext-badge{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.1em;color:var(--warn);border:1px solid rgba(255,180,84,.5);border-radius:5px;padding:1px 5px;margin-bottom:6px}
.mgr-overlay{position:fixed;inset:0;background:rgba(5,2,24,.78);backdrop-filter:blur(5px);z-index:120;display:none;align-items:flex-start;justify-content:center;padding:40px 18px;overflow-y:auto}
.mgr-overlay.show{display:flex}
.mgr-box{width:min(620px,100%);background:var(--navy-1);border:1px solid var(--line-2);border-radius:16px;box-shadow:0 40px 90px -40px rgba(0,0,0,.85);overflow:hidden}
.mgr-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:20px 24px;border-bottom:1px solid var(--line)}
.mgr-head .mh-eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--coral);font-weight:700}
.mgr-head h2{font-family:var(--serif);font-size:21px;font-weight:600;margin-top:3px}
.mgr-body{padding:18px 24px;max-height:62vh;overflow-y:auto}
.mgr-foot{padding:14px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;background:var(--navy)}
.mgr-row{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:11px;margin-bottom:10px;background:rgba(244,244,244,.03)}
.mgr-row input.mr-name{flex:1;min-width:60px;padding:9px 11px;background:rgba(244,244,244,.05);border:1px solid var(--line);border-radius:8px;color:var(--cream);font-size:14px;font-weight:600}
.mgr-row input.mr-type{flex:1;min-width:60px;padding:9px 11px;background:rgba(244,244,244,.05);border:1px solid var(--line);border-radius:8px;color:var(--cream);font-size:13px}
.mgr-row input:focus{outline:none;border-color:var(--coral-line)}
.swatch{width:34px;height:34px;border-radius:8px;border:2px solid var(--line-2);cursor:pointer;flex-shrink:0;padding:0;overflow:hidden}
.mr-count{font-size:11px;color:var(--cream-faint);white-space:nowrap}
.mgr-add{display:flex;gap:9px;margin-top:6px}
.mgr-add input{flex:1;padding:10px 12px;background:rgba(244,244,244,.05);border:1px dashed var(--line-2);border-radius:9px;color:var(--cream);font-size:14px}
.mgr-add input:focus{outline:none;border-color:var(--coral-line)}
.mgr-empty{font-size:13px;color:var(--cream-faint);padding:8px 2px 14px}
/* supplier links editor */
.sup-link{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:rgba(255,180,84,.05)}
.sup-link .sl-name{flex:1;font-size:13.5px;font-weight:600}
.sup-link select{padding:6px 8px;background:rgba(244,244,244,.06);border:1px solid var(--line);border-radius:7px;color:var(--cream);font-size:12px}
.sup-link select:focus{outline:none;border-color:var(--coral-line)}
.sup-add{display:flex;gap:8px;align-items:center}
.sup-add select{flex:1;padding:9px 11px;background:rgba(244,244,244,.05);border:1px solid var(--line);border-radius:8px;color:var(--cream);font-size:13.5px}
.flow-rel .fr.ext svg{color:var(--warn)}
.flow-rel .fr.ext{background:rgba(255,180,84,.10)}
/* fix native dropdown contrast (was light-on-light when opened) */
select option{background-color:#16114a;color:#F4F4F4}
select optgroup{background-color:#16114a;color:#F4F4F4}
/* current user badge */
.userchip{display:flex;align-items:center;gap:9px;background:rgba(244,244,244,.05);border:1px solid var(--line);border-radius:10px;padding:5px 6px 5px 11px;flex-shrink:0}
.userchip .ua{width:28px;height:28px;border-radius:7px;background:var(--coral);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.userchip .un{font-size:12.5px;font-weight:700;line-height:1.1}
.userchip .ur{font-size:10.5px;color:var(--cream-dim);text-transform:uppercase;letter-spacing:.05em}
.userchip .uout{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:transparent;display:grid;place-items:center}
.userchip .uout:hover{background:rgba(255,73,72,.12)}
.userchip .uout svg{width:13px;height:13px;color:var(--cream-dim)}
/* login overlay */
.login-overlay{position:fixed;inset:0;z-index:200;background:var(--navy);background-image:radial-gradient(1000px 700px at 80% -10%,rgba(255,73,72,.16),transparent 60%),radial-gradient(800px 600px at -8% 110%,rgba(34,24,99,.7),transparent 55%);display:none;align-items:center;justify-content:center;padding:24px}
.login-overlay.show{display:flex}
.login-box{width:min(420px,100%);background:linear-gradient(180deg,var(--navy-1),var(--navy));border:1px solid var(--line-2);border-radius:18px;padding:34px 32px;box-shadow:0 40px 90px -40px rgba(0,0,0,.85)}
.login-box .lb-brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.login-box .lb-brand .divider{width:1px;height:40px;background:var(--cream);opacity:.5}
.login-box .lb-brand .l1{font-family:var(--serif);font-size:18px;font-weight:700}
.login-box .lb-brand .l2{font-size:11.5px;color:var(--cream-dim)}
.login-box h2{font-family:var(--serif);font-size:23px;font-weight:600;margin:18px 0 4px}
.login-box .lsub{font-size:13px;color:var(--cream-dim);margin-bottom:22px}
.login-box label{display:block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--cream-dim);margin:0 0 7px}
.login-box select,.login-box input{width:100%;padding:12px 13px;background:rgba(244,244,244,.05);border:1px solid var(--line);border-radius:10px;color:var(--cream);font-size:14.5px;margin-bottom:16px}
.login-box select:focus,.login-box input:focus{outline:none;border-color:var(--coral-line)}
.login-box .lbtn{width:100%;padding:13px;background:var(--coral);border:none;border-radius:10px;color:#fff;font-size:14.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.login-box .lbtn:hover{background:var(--coral-2)}
.login-box .lerr{font-size:12.5px;color:var(--coral-2);margin:-8px 0 14px;min-height:16px}
.login-box .lhint{font-size:11.5px;color:var(--cream-faint);margin-top:16px;text-align:center;line-height:1.5}
/* approval section in editor */
.appr-stage{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.appr-flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.appr-step{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;color:var(--cream-faint);padding:6px 10px;border-radius:8px;border:1px solid var(--line)}
.appr-step.done{color:var(--ok);border-color:rgba(55,211,153,.4);background:rgba(55,211,153,.08)}
.appr-step.current{color:var(--coral-2);border-color:var(--coral-line);background:var(--coral-soft)}
.appr-step .as-dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.appr-arrow{color:var(--cream-faint);font-size:12px}
.appr-stamp{font-size:12px;color:var(--cream-dim);padding:8px 12px;background:rgba(244,244,244,.04);border:1px solid var(--line);border-radius:9px;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.appr-stamp svg{width:14px;height:14px;color:var(--ok);flex-shrink:0}
.appr-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:8px}
.stage-badge{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;padding:7px 13px;border-radius:9px}
/* history */
.hist{margin-top:6px;border:1px solid var(--line);border-radius:10px;max-height:150px;overflow-y:auto;background:rgba(244,244,244,.03)}
.hist-row{display:flex;gap:10px;align-items:baseline;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12px}
.hist-row:last-child{border-bottom:none}
.hist-row .hr-act{font-weight:700;color:var(--cream)}
.hist-row .hr-by{color:var(--cream-dim)}
.hist-row .hr-at{margin-left:auto;color:var(--cream-faint);font-size:11px;white-space:nowrap}
.lastedit{font-size:11.5px;color:var(--cream-faint);margin-top:3px}
/* SOP signature block */
.sig-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:8px}
.sig-cell{border-top:2px solid var(--ink);padding-top:8px}
.sig-cell .sig-role{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#8a8a96;font-weight:700}
.sig-cell .sig-name{font-size:14px;font-weight:600;color:var(--ink);margin-top:4px;min-height:18px}
.sig-cell .sig-date{font-size:11.5px;color:#8a8a96;margin-top:2px}
.sig-pending{font-style:italic;color:#b3b3bd}
.role-pill{font-size:9px;font-weight:800;letter-spacing:.06em;padding:2px 6px;border-radius:5px;background:rgba(244,244,244,.08);color:var(--cream-dim);text-transform:uppercase}
</style>
</head>
<body>

</header>
<main class="wrap">
  <section class="view active" id="view-dashboard">
    <div class="page-head">

      <button class="btn primary" onclick="openEditor()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><span data-i18n="new_process"></span></button>

      </div>

    </div>
  </section>
  <section class="view" id="view-processes">
    <div class="page-head">
      <div><span class="eyebrow" data-i18n="proc_eyebrow"></span><h1 data-i18n="proc_h1"></h1><p data-i18n="proc_p"></p></div>
      <button class="btn primary" onclick="openEditor()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><span data-i18n="new_process"></span></button>
    </div>
    <div class="toolbar">
      <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg><input type="text" id="searchInput" data-i18n-ph="search_ph"></div>

  <section class="view" id="view-map">

      <div class="li" style="margin-left:auto;gap:8px">
        <button class="btn ghost sm" id="mgrDeptBtn" data-i18n="manage_depts"></button>

function t(key,...a){let s=(I18N[LANG]&&I18N[LANG][key]!==undefined)?I18N[LANG][key]:(I18N.en[key]!==undefined?I18N.en[key]:key);if(typeof s==='string'&&a.length)s=s.replace(/\{(\d+)\}/g,(m,i)=>a[i]!==undefined?a[i]:m);return s;}
function noun(n,base){return n===1?t(base+'_one'):t(base+'_many');}
const FREQ=['continuous','daily','weekly','biweekly','monthly','quarterly','annually','adhoc'];
function freqLabel(k){return t('freq_'+k);}
function statusLabel(k){return {draft:t('st_draft'),submitted:t('st_submitted'),dir_approved:t('st_dir_approved'),review:t('st_submitted'),approved:t('st_approved')}[k]||t('st_draft');}
const ROLES=['staff','director','gm'];
function roleLabel(r){return {staff:t('role_staff'),director:t('role_director'),gm:t('role_gm')}[r]||t('role_staff');}
let CURRENT=null; /* current signed-in user object */
function isDirector(){return CURRENT&&(CURRENT.role==='director'||CURRENT.role==='gm');}
function isGM(){return CURRENT&&CURRENT.role==='gm';}

function downstream(id){return DB.processes.filter(p=>(p.dependsOn||[]).includes(id));}
function initials(n){if(!n)return '';return n.trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function makeUsers(lang){return (SEED_USERS[lang]||SEED_USERS.en).map(u=>({id:uid(),name:u.name,role:u.role,pin:''}));}
function seed(lang){
  const dn=SEED_DEPTS[lang]||SEED_DEPTS.en;
  DB.departments=dn.map((name,i)=>({id:uid(),name,color:DEPT_COLORS[i]}));
  const ssrc=SEED_SUP[lang]||SEED_SUP.en;
  DB.suppliers=ssrc.map(s=>({id:uid(),name:s.n,type:s.type,notes:''}));
  DB.users=makeUsers(lang);
  const src=SEED_PROC[lang]||SEED_PROC.en;
  const ids=src.map(()=>uid());
  DB.processes=src.map((x,i)=>{
    const st=x.s==='review'?'submitted':x.s;const ts=Date.now();const appr={};
    if(st==='approved'){appr.director={by:'Devon Clarke',at:ts};appr.gm={by:'Ana Rivera',at:ts};}
    return {id:ids[i],name:x.n,departmentId:DB.departments[x.d].id,ownerName:x.o,ownerRole:x.r,backupOwner:'',
    purpose:x.p,trigger:x.tr,frequency:x.f,status:st,priority:'Medium',
    inputs:x.in.slice(),outputs:x.out.slice(),systems:x.sys.slice(),kpis:x.kp.slice(),risks:x.rk.slice(),
    steps:x.st.map(s=>({id:uid(),text:s[0],role:s[1],system:s[2]})),
    dependsOn:x.deps.map(di=>ids[di]),supplierLinks:[],notes:'',
    approvals:appr,history:[{by:x.o||'—',role:'staff',action:'act_created',at:ts}],lastEditedBy:{name:x.o||'—',role:'staff'},updatedAt:ts};
  });
  SEED_SUP_LINKS.forEach(([pi,si,dir])=>{if(DB.processes[pi]&&DB.suppliers[si])DB.processes[pi].supplierLinks.push({supplierId:DB.suppliers[si].id,dir});});
}

/* ===== INIT ===== */
(async function init(){
  const saved=await Store.get();
  if(saved&&saved.processes&&saved.processes.length){DB=saved;LANG=(saved.meta&&saved.meta.lang)||'en';
    if(!DB.suppliers)DB.suppliers=[];
    if(!DB.users||!DB.users.length)DB.users=makeUsers(LANG);
    DB.processes.forEach(p=>{if(!p.supplierLinks)p.supplierLinks=[];if(p.status==='review')p.status='submitted';if(!p.approvals)p.approvals={};if(!p.history)p.history=[];if(!p.lastEditedBy)p.lastEditedBy=p.ownerName?{name:p.ownerName,role:'staff'}:null;});
    await save();}
  else{LANG=detectLang();seed(LANG);DB.meta={lang:LANG};await Store.set(DB);}
  applyStaticI18n();bind();
  const lastId=DB.meta&&DB.meta.currentUserId;const u=lastId&&DB.users.find(x=>x.id===lastId);
  if(u){CURRENT=u;onAuthed();}else{showLogin();}
})();
async function save(){DB.meta=DB.meta||{};DB.meta.lang=LANG;if(CURRENT)DB.meta.currentUserId=CURRENT.id;DB.meta.lastSaved=Date.now();await Store.set(DB);}

  if(first){wrap.innerHTML=`<label>${t('login_select_user')}</label><input id="liName" placeholder="${esc(t('login_name_ph'))}"><label>${t('user_role')}</label><select id="liRole">${ROLES.map(r=>`<option value="${r}">${esc(roleLabel(r))}</option>`).join('')}</select>`;}

function doLogin(){const errEl=document.getElementById('loginErr');errEl.textContent='';const first=!DB.users||!DB.users.length;
  if(first){const name=(document.getElementById('liName').value||'').trim();if(!name){errEl.textContent=t('login_err_name');return;}const role=document.getElementById('liRole').value;const u={id:uid(),name,role,pin:''};DB.users=[u];CURRENT=u;save();onAuthed();return;}
  const sel=document.getElementById('liUser');const u=DB.users.find(x=>x.id===sel.value);if(!u){errEl.textContent=t('login_err_select');return;}
  if(u.pin){const pe=document.getElementById('liPin');const pin=(pe?pe.value:'')||'';if(pin!==u.pin){errEl.textContent=t('login_err_pin');return;}}
  CURRENT=u;save();onAuthed();
}

/* ===== APPLY STATIC I18N ===== */
function applyStaticI18n(){
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.getAttribute('data-i18n'));});
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{el.placeholder=t(el.getAttribute('data-i18n-ph'));});
  document.querySelectorAll('[data-i18n-title]').forEach(el=>{el.title=t(el.getAttribute('data-i18n-title'));});
  document.querySelectorAll('#langsel button').forEach(b=>b.classList.toggle('active',b.dataset.lang===LANG));
}
function setLang(l){if(l===LANG)return;LANG=l;applyStaticI18n();renderAll();updateUserChip();save();
  if(document.getElementById('drawer').classList.contains('show'))renderForm();
  if(document.getElementById('docOverlay').classList.contains('show'))closeDoc();
  if(document.getElementById('mgrOverlay').classList.contains('show')&&mgrMode)openMgr(mgrMode);

}

function drawLinks(){
  const svg=document.getElementById('mapLinks'),scroll=document.getElementById('mapScroll');if(!scroll)return;
  const base=scroll.getBoundingClientRect(),W=scroll.scrollWidth,H=scroll.scrollHeight;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.style.width=W+'px';svg.style.height=H+'px';
  let paths='';
  DB.processes.forEach(p=>{(p.dependsOn||[]).forEach(uid=>{const a=document.getElementById('node-'+uid),b=document.getElementById('node-'+p.id);if(!a||!b)return;
    const ra=a.getBoundingClientRect(),rb=b.getBoundingClientRect();
    const x1=ra.right-base.left+scroll.scrollLeft,y1=ra.top+ra.height/2-base.top+scroll.scrollTop;
    const x2=rb.left-base.left+scroll.scrollLeft,y2=rb.top+rb.height/2-base.top+scroll.scrollTop;
    const u=proc(uid),cross=u&&u.departmentId!==p.departmentId,active=mapHL&&(mapHL===uid||mapHL===p.id);
    const col=cross?'#FF4948':'rgba(244,244,244,.32)',w=active?2.6:(cross?1.8:1.4),op=mapHL?(active?1:.12):(cross?.9:.55),mx=(x1+x2)/2;
    paths+=`<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" fill="none" stroke="${col}" stroke-width="${w}" opacity="${op}" stroke-linecap="round"/><circle cx="${x2}" cy="${y2}" r="${active?4:3}" fill="${col}" opacity="${op}"/>`;});});
  DB.processes.forEach(p=>{(p.supplierLinks||[]).forEach(l=>{const sN=document.getElementById('snode-'+l.supplierId),pN=document.getElementById('node-'+p.id);if(!sN||!pN)return;
    const rs=sN.getBoundingClientRect(),rp=pN.getBoundingClientRect();
    const px=rp.right-base.left+scroll.scrollLeft,py=rp.top+rp.height/2-base.top+scroll.scrollTop;
    const sx=rs.left-base.left+scroll.scrollLeft,sy=rs.top+rs.height/2-base.top+scroll.scrollTop;
    const active=mapHL&&(mapHL===p.id||mapHL===l.supplierId);
    const col='#FFB454',w=active?2.6:1.6,op=mapHL?(active?1:.12):.75,mx=(px+sx)/2;
    paths+=`<path d="M${px},${py} C${mx},${py} ${mx},${sy} ${sx},${sy}" fill="none" stroke="${col}" stroke-width="${w}" opacity="${op}" stroke-dasharray="5 4" stroke-linecap="round"/>`;
    if(l.dir==='out'||l.dir==='both')paths+=`<circle cx="${sx}" cy="${sy}" r="${active?4:3}" fill="${col}" opacity="${op}"/>`;
    if(l.dir==='in'||l.dir==='both')paths+=`<circle cx="${px}" cy="${py}" r="${active?4:3}" fill="${col}" opacity="${op}"/>`;});});
  svg.innerHTML=paths;
}

function chipField(key,labelKey,phKey){return `<div class="fgroup"><label>${t(labelKey)}</label><div class="chips" id="chips_${key}"></div><div class="chip-input"><input class="mini-i" id="ci_${key}" placeholder="${esc(t(phKey))}" onkeydown="if(event.key==='Enter'){event.preventDefault();addChip('${key}')}"><button class="btn sm" onclick="addChip('${key}')">${t('btn_add')}</button></div></div>`;}
function renderChips(key){const c=document.getElementById('chips_'+key);if(!c)return;const arr=draft[key]||[];c.innerHTML=arr.map((x,i)=>`<span class="chip">${esc(x)}<button onclick="rmChip('${key}',${i})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></span>`).join('');}
function addChip(key){const inp=document.getElementById('ci_'+key);const v=inp.value.trim();if(!v)return;draft[key]=draft[key]||[];draft[key].push(v);inp.value='';renderChips(key);inp.focus();}

function renderSteps(){const c=document.getElementById('stepList');if(!c)return;const steps=draft.steps||[];

}
function addStep(){draft.steps=draft.steps||[];draft.steps.push({id:uid(),text:'',role:'',system:''});renderSteps();}
function rmStep(i){draft.steps.splice(i,1);renderSteps();}
function moveStep(i,dir){const j=i+dir;if(j<0||j>=draft.steps.length)return;const s=draft.steps;[s[i],s[j]]=[s[j],s[i]];renderSteps();}
function renderDeps(){const c=document.getElementById('depList');if(!c)return;const others=DB.processes.filter(p=>p.id!==editingId);
  if(!others.length){c.innerHTML=`<div style="padding:10px;font-size:12.5px;color:var(--cream-faint)">${t('depends_empty')}</div>`;return;}
  c.innerHTML=others.map(p=>{const d=dept(p.departmentId);const on=(draft.dependsOn||[]).includes(p.id);return `<label class="dep-item"><input type="checkbox" ${on?'checked':''} onchange="toggleDep('${p.id}',this.checked)"><span><span class="di-name">${esc(p.name)}</span> <span class="di-dept">· ${d?esc(d.name):''}</span></span></label>`;}).join('');
}
function toggleDep(id,on){draft.dependsOn=draft.dependsOn||[];if(on){if(!draft.dependsOn.includes(id))draft.dependsOn.push(id);}else{draft.dependsOn=draft.dependsOn.filter(x=>x!==id);}}
function renderSupLinks(){
  const c=document.getElementById('supLinks'),w=document.getElementById('supAddWrap');if(!c||!w)return;

  c.innerHTML=links.map((l,i)=>{const s=supplier(l.supplierId);if(!s)return '';return `<div class="sup-link"><span class="sl-name">${esc(s.name)}${s.type?` <span style="color:var(--cream-faint);font-weight:500">· ${esc(s.type)}</span>`:''}</span><select onchange="setSupDir(${i},this.value)"><option value="in" ${l.dir==='in'?'selected':''}>${esc(t('dir_in'))}</option><option value="out" ${l.dir==='out'?'selected':''}>${esc(t('dir_out'))}</option><option value="both" ${l.dir==='both'?'selected':''}>${esc(t('dir_both'))}</option></select><button class="icon-btn del" onclick="rmSupLink(${i})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>`;}).join('');

  w.innerHTML=`<div class="sup-add"><select id="supPick"><option value="">${t('sup_pick')}</option>${avail.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select><button class="btn sm" onclick="addSupLink()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>${t('btn_add')}</button></div>`;
}
function addSupLink(){const sel=document.getElementById('supPick');const id=sel&&sel.value;if(!id)return;draft.supplierLinks=draft.supplierLinks||[];draft.supplierLinks.push({supplierId:id,dir:'in'});renderSupLinks();}
function rmSupLink(i){draft.supplierLinks.splice(i,1);renderSupLinks();}
function setSupDir(i,v){draft.supplierLinks[i].dir=v;}
function renderApproval(){
  const c=document.getElementById('apprBox');if(!c||!draft)return;
  const order=['draft','submitted','dir_approved','approved'];const cur=order.indexOf(draft.status);
  const steps=order.map((k,i)=>`<span class="appr-step ${i<cur?'done':''} ${i===cur?'current':''}"><span class="as-dot"></span>${statusLabel(k)}</span>`).join('<span class="appr-arrow">→</span>');
  const a=draft.approvals||{};let stamps='';
  if(a.director)stamps+=`<div class="appr-stamp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6 9 17l-5-5"/></svg><span><b>${t('appr_director_label')}:</b> ${esc(a.director.by)} · ${fmtDate(a.director.at)}</span></div>`;
  if(a.gm)stamps+=`<div class="appr-stamp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6 9 17l-5-5"/></svg><span><b>${t('appr_gm_label')}:</b> ${esc(a.gm.by)} · ${fmtDate(a.gm.at)}</span></div>`;
  let actions='';
  if(draft.status==='draft')actions+=`<button class="btn primary sm" onclick="doStage('submit')">${t('submit_for_approval')}</button>`;
  else if(draft.status==='submitted'){if(isDirector())actions+=`<button class="btn primary sm" onclick="doStage('dir')">${t('approve_director')}</button>`;actions+=`<button class="btn sm" onclick="doStage('back')">${t('send_back')}</button>`;}
  else if(draft.status==='dir_approved'){if(isGM())actions+=`<button class="btn primary sm" onclick="doStage('gm')">${t('approve_gm')}</button>`;actions+=`<button class="btn sm" onclick="doStage('back')">${t('send_back')}</button>`;}
  else if(draft.status==='approved')actions+=`<button class="btn sm" onclick="doStage('back')">${t('send_back')}</button>`;
  c.innerHTML=`<div class="appr-flow">${steps}</div>${stamps}<div class="appr-actions">${actions}</div>`;
}
function renderHistory(){const c=document.getElementById('histBox');if(!c||!draft)return;const h=draft.history||[];
  if(!h.length){c.innerHTML=`<div class="mgr-empty">—</div>`;return;}
  c.innerHTML=`<div class="hist">${h.map(e=>`<div class="hist-row"><span class="hr-act">${t(e.action)}</span><span class="hr-by">${esc(e.by)} · ${roleLabel(e.role)}</span><span class="hr-at">${fmtDate(e.at)}</span></div>`).join('')}</div>`;
}
function doStage(action){
  if(!draft)return;
  if(!draft.name||!draft.name.trim()){toast(t('toast_name'));const n=document.getElementById('f_name');if(n)n.focus();return;}
  if(action==='submit'){draft.status='submitted';logHistory(draft,'act_submitted');toast(t('toast_submitted'));}
  else if(action==='dir'){if(!isDirector()){toast(t('toast_no_perm'));return;}draft.status='dir_approved';draft.approvals=draft.approvals||{};draft.approvals.director={by:CURRENT.name,at:Date.now()};logHistory(draft,'act_dir_approved');toast(t('toast_dir_approved'));}
  else if(action==='gm'){if(!isGM()){toast(t('toast_no_perm'));return;}draft.status='approved';draft.approvals=draft.approvals||{};draft.approvals.gm={by:CURRENT.name,at:Date.now()};logHistory(draft,'act_gm_approved');toast(t('toast_gm_approved'));}
  else if(action==='back'){draft.status='draft';draft.approvals={};logHistory(draft,'act_sent_back');toast(t('toast_sent_back'));}
  if(editingId){const i=DB.processes.findIndex(p=>p.id===editingId);if(i>=0)DB.processes[i]=draft;}else{draft.id=uid();editingId=draft.id;DB.processes.push(draft);}
  save();renderAll();renderApproval();renderHistory();
  const sb=document.querySelector('#drawerBody .status');if(sb){sb.className='status '+draft.status;sb.textContent=statusLabel(draft.status);}
}

let mgrMode=null;
function openMgr(mode){mgrMode=mode;const ey={dept:'mgr_dept_eyebrow',sup:'mgr_sup_eyebrow',users:'mgr_user_eyebrow'}[mode],ti={dept:'mgr_dept_title',sup:'mgr_sup_title',users:'mgr_user_title'}[mode];document.getElementById('mgrEyebrow').textContent=t(ey);document.getElementById('mgrTitle').textContent=t(ti);document.getElementById('mgrDone').textContent=t('done');renderMgr();document.getElementById('mgrOverlay').classList.add('show');document.body.style.overflow='hidden';}

function openSupplierMgr(){openMgr('sup');}
function openUserMgr(){openMgr('users');}
function closeMgr(){document.getElementById('mgrOverlay').classList.remove('show');document.body.style.overflow=document.getElementById('drawer').classList.contains('show')?'hidden':'';mgrMode=null;}
function renderMgr(){const b=document.getElementById('mgrBody');if(!b||!mgrMode)return;

    const rows=DB.departments.map(d=>{const n=DB.processes.filter(p=>p.departmentId===d.id).length;return `<div class="mgr-row"><input type="color" class="swatch" value="${d.color}" oninput="setDeptColor('${d.id}',this.value)"><input class="mr-name" value="${esc(d.name)}" oninput="setDeptName('${d.id}',this.value)"><span class="mr-count">${t('step_count',n,noun(n,'proc'))}</span><button class="icon-btn del" onclick="delDept('${d.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2m1 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button></div>`;}).join('');
    b.innerHTML=rows+`<div class="mgr-add"><input id="newDeptName" placeholder="${esc(t('add_dept_ph'))}" onkeydown="if(event.key==='Enter')addDept()"><button class="btn primary sm" onclick="addDept()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>${t('btn_add')}</button></div>`;
  }else if(mgrMode==='sup'){
    const sups=DB.suppliers||[];
    const rows=sups.map(s=>{const n=DB.processes.filter(p=>(p.supplierLinks||[]).some(l=>l.supplierId===s.id)).length;return `<div class="mgr-row"><input class="mr-name" value="${esc(s.name)}" oninput="setSupName('${s.id}',this.value)"><input class="mr-type" value="${esc(s.type||'')}" placeholder="${esc(t('sup_type_ph'))}" oninput="setSupType('${s.id}',this.value)"><span class="mr-count">↔ ${n}</span><button class="icon-btn del" onclick="delSupplier('${s.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>`;}).join('')||`<div class="mgr-empty">${t('mgr_sup_empty')}</div>`;
    b.innerHTML=rows+`<div class="mgr-add"><input id="newSupName" placeholder="${esc(t('add_sup_ph'))}" onkeydown="if(event.key==='Enter')addSupplier()"><button class="btn primary sm" onclick="addSupplier()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>${t('btn_add')}</button></div>`;
  }else{
    const us=DB.users||[];
    const rows=us.map(u=>`<div class="mgr-row"><input class="mr-name" value="${esc(u.name)}" oninput="setUserName('${u.id}',this.value)"><select class="mr-type" onchange="setUserRole('${u.id}',this.value)">${ROLES.map(r=>`<option value="${r}" ${u.role===r?'selected':''}>${esc(roleLabel(r))}</option>`).join('')}</select><input class="mr-type" style="max-width:110px" value="${esc(u.pin||'')}" placeholder="${esc(t('pin_optional'))}" oninput="setUserPin('${u.id}',this.value)">${u.id===(CURRENT&&CURRENT.id)?'':`<button class="icon-btn del" onclick="delUser('${u.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>`}</div>`).join('')||`<div class="mgr-empty">${t('mgr_user_empty')}</div>`;
    b.innerHTML=rows+`<div class="mgr-add"><input id="newUserName" placeholder="${esc(t('add_user_ph'))}" onkeydown="if(event.key==='Enter')addUser()"><button class="btn primary sm" onclick="addUser()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>${t('btn_add')}</button></div>`;
  }
}
function setUserName(id,v){const u=(DB.users||[]).find(x=>x.id===id);if(u){u.name=v;save();if(CURRENT&&CURRENT.id===id)updateUserChip();}}
function setUserRole(id,v){const u=(DB.users||[]).find(x=>x.id===id);if(u){u.role=v;save();if(CURRENT&&CURRENT.id===id){CURRENT.role=v;updateUserChip();if(document.getElementById('drawer').classList.contains('show'))renderApproval();}}}

function addUser(){const inp=document.getElementById('newUserName');const v=(inp.value||'').trim();if(!v)return;DB.users=DB.users||[];DB.users.push({id:uid(),name:v,role:'staff',pin:''});inp.value='';save();renderMgr();toast(t('toast_user_added'));}
function delUser(id){if(CURRENT&&CURRENT.id===id)return;const u=(DB.users||[]).find(x=>x.id===id);if(!confirm(t('confirm_del_user',u?u.name:'')))return;DB.users=(DB.users||[]).filter(x=>x.id!==id);save();renderMgr();toast(t('toast_user_removed'));}

function addDept(){const inp=document.getElementById('newDeptName');const v=(inp.value||'').trim();if(!v)return;const palette=['#FF4948','#5B8DEF','#37D399','#C77DFF','#FFB454','#4EC3C9','#F36FB0','#9B8CFF'];DB.departments.push({id:uid(),name:v,color:palette[DB.departments.length%palette.length]});inp.value='';save();renderMgr();fillDeptFilters();renderDash();renderMap();toast(t('toast_dept_added'));}
function delDept(id){const n=DB.processes.filter(p=>p.departmentId===id).length;if(n){toast(t('dept_blocked'));return;}const d=dept(id);if(!confirm(t('confirm_del_dept',d?d.name:'')))return;DB.departments=DB.departments.filter(x=>x.id!==id);save();renderMgr();fillDeptFilters();renderDash();renderMap();toast(t('toast_dept_removed'));}
function setSupName(id,v){const s=supplier(id);if(s){s.name=v;save();}}
function setSupType(id,v){const s=supplier(id);if(s){s.type=v;save();}}
function addSupplier(){const inp=document.getElementById('newSupName');const v=(inp.value||'').trim();if(!v)return;DB.suppliers=DB.suppliers||[];DB.suppliers.push({id:uid(),name:v,type:'',notes:''});inp.value='';save();renderMgr();renderMap();if(document.getElementById('drawer').classList.contains('show'))renderSupLinks();toast(t('toast_sup_added'));}
function delSupplier(id){const s=supplier(id);if(!confirm(t('confirm_del_sup',s?s.name:'')))return;DB.suppliers=(DB.suppliers||[]).filter(x=>x.id!==id);DB.processes.forEach(p=>{p.supplierLinks=(p.supplierLinks||[]).filter(l=>l.supplierId!==id);});save();renderMgr();renderMap();if(document.getElementById('drawer').classList.contains('show'))renderSupLinks();toast(t('toast_sup_removed'));}
function saveProcess(){
  if(!draft.name||!draft.name.trim()){toast(t('toast_name'));const n=document.getElementById('f_name');if(n)n.focus();return;}
  if(editingId){logHistory(draft,'act_edited');const i=DB.processes.findIndex(p=>p.id===editingId);draft.id=editingId;DB.processes[i]=draft;toast(t('toast_updated'));}
  else{draft.id=uid();draft.status=draft.status||'draft';logHistory(draft,'act_created');DB.processes.push(draft);toast(t('toast_added'));}
  save();renderAll();closeEditor();
}

function exportData(){const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='global-1080-processes.json';a.click();URL.revokeObjectURL(a.href);toast(t('toast_exported'));}
function csvCell(v){const s=(v==null?'':String(v));return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
function exportCSV(){
  if(!DB.processes.length){toast(t('toast_no_csv'));return;}
  const rows=[t('csv_h')];
  DB.processes.forEach(p=>{const d=dept(p.departmentId);
    const steps=(p.steps||[]).map((s,i)=>`${i+1}. ${s.text}${s.role?' ['+s.role+(s.system?' / '+s.system:'')+']':(s.system?' ['+s.system+']':'')}`).join(' | ');
    const deps=(p.dependsOn||[]).map(id=>{const u=proc(id);return u?u.name:'';}).filter(Boolean).join(' | ');
    const sups=(p.supplierLinks||[]).map(l=>{const s=supplier(l.supplierId);if(!s)return '';const lab=l.dir==='in'?t('doc_sup_in'):l.dir==='out'?t('doc_sup_out'):t('doc_sup_both');return `${s.name} (${lab})`;}).filter(Boolean).join(' | ');
    rows.push([p.name,d?d.name:'',p.ownerName||'',p.ownerRole||'',p.backupOwner||'',freqLabel(p.frequency),statusLabel(p.status),p.purpose||'',p.trigger||'',(p.inputs||[]).join(' | '),(p.outputs||[]).join(' | '),(p.systems||[]).join(' | '),steps,deps,(p.kpis||[]).join(' | '),(p.risks||[]).join(' | '),p.notes||'',sups]);
  });
  const csv='\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='global-1080-processes.csv';a.click();URL.revokeObjectURL(a.href);toast(t('toast_csv'));
}
function importData(file){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.departments||!d.processes)throw 0;DB=d;DB.suppliers=DB.suppliers||[];if(!DB.users||!DB.users.length)DB.users=makeUsers(LANG);DB.processes.forEach(p=>{if(!p.supplierLinks)p.supplierLinks=[];if(p.status==='review')p.status='submitted';if(!p.approvals)p.approvals={};if(!p.history)p.history=[];if(!p.lastEditedBy)p.lastEditedBy=p.ownerName?{name:p.ownerName,role:'staff'}:null;});if(DB.meta&&DB.meta.lang)LANG=DB.meta.lang;applyStaticI18n();save();renderAll();toast(t('toast_imported'));const stillThere=CURRENT&&DB.users.find(u=>u.id===CURRENT.id);if(!stillThere){CURRENT=null;showLogin();}else updateUserChip();}catch(e){toast(t('toast_invalid'));}};r.readAsText(file);}

/* ===== NAV / BIND ===== */
function switchTab(name){document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id==='view-'+name));if(name==='map')requestAnimationFrame(()=>drawLinks());}
function bind(){
  document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)switchTab(b.dataset.tab);});
  document.getElementById('langsel').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setLang(b.dataset.lang);});
  document.getElementById('searchInput').addEventListener('input',renderProcesses);
  document.getElementById('filterDept').addEventListener('change',renderProcesses);
  document.getElementById('filterStatus').addEventListener('change',renderProcesses);
  document.getElementById('mapReset').addEventListener('click',()=>{mapHL=null;applyMapHL();});
  document.getElementById('mgrDeptBtn').addEventListener('click',openDeptMgr);
  document.getElementById('mgrSupBtn').addEventListener('click',openSupplierMgr);
  document.getElementById('mgrUserBtn').addEventListener('click',openUserMgr);
  document.getElementById('signOutBtn').addEventListener('click',signOut);
  document.getElementById('loginBtn').addEventListener('click',doLogin);
  document.getElementById('mgrClose').addEventListener('click',closeMgr);
  document.getElementById('mgrDone').addEventListener('click',closeMgr);
  document.getElementById('mgrOverlay').addEventListener('click',e=>{if(e.target.id==='mgrOverlay')closeMgr();});
  document.getElementById('printAllBtn').addEventListener('click',openFullManual);
  document.getElementById('saveProc').addEventListener('click',saveProcess);
  document.getElementById('overlay').addEventListener('click',closeEditor);
  document.getElementById('exportBtn').addEventListener('click',exportData);
  document.getElementById('csvBtn').addEventListener('click',exportCSV);
  document.getElementById('importBtn').addEventListener('click',()=>document.getElementById('fileInput').click());
  document.getElementById('fileInput').addEventListener('change',e=>{if(e.target.files[0])importData(e.target.files[0]);e.target.value='';});
  window.addEventListener('resize',()=>{if(document.getElementById('view-map').classList.contains('active'))drawLinks();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.getElementById('mgrOverlay').classList.contains('show'))closeMgr();else if(document.getElementById('docOverlay').classList.contains('show'))closeDoc();else if(document.getElementById('drawer').classList.contains('show'))closeEditor();}});
}
let toastTimer;
function toast(msg){const el=document.getElementById('toast');el.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 6 9 17l-5-5"/></svg>${esc(msg)}`;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2400);}
</script>
